name: CI

on:
  push:
    branches: [main]
    # Notes and specs can't break the site, so changing only those skips the checks.
    paths-ignore:
      - "docs/**"
      - "openspec/**"
  pull_request:
  workflow_dispatch:

# A newer push replaces a run that is still going for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Format, types, lint, unit tests and a build. No database, no browser: a few minutes at most.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sharkly_ci
          CRON_SECRET: cccccccccccccccccccccccccccccccc
          BETTER_AUTH_SECRET: ci-Q7mZ4kLw9xT2vB8nR5cH1yJ6pD3fG0aS
          BETTER_AUTH_URL: http://localhost:3500
          EMAIL_FROM: Sharkly <ci@example.com>
